<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click-to-Explode</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            cursor: crosshair;
        }
        .particle {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #fff;
            border-radius: 50%;
            pointer-events: none;
            animation: fadeOut 2s linear forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <script>
        const particles = [];

        document.addEventListener('click', function(e) {
            const numParticles = 10;
            for (let i = 0; i < numParticles; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = e.clientX - 10 + 'px';
                particle.style.top = e.clientY - 10 + 'px';
                const angle = (Math.PI * 2 / numParticles) * i;
                const speed = Math.random() * 5 + 2;
                particle.vx = Math.cos(angle) * speed;
                particle.vy = Math.sin(angle) * speed;
                particle.x = e.clientX;
                particle.y = e.clientY;
                document.body.appendChild(particle);
                particles.push(particle);
            }
        });

        function animate() {
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.style.left = p.x - 10 + 'px';
                p.style.top = p.y - 10 + 'px';
                p.vy += 0.1; // gravity
                if (p.y > window.innerHeight + 20) {
                    p.remove();
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
