<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover-Glitch Effect</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        img {
            max-width: 400px;
            max-height: 300px;
            transition: transform 0.1s ease, filter 0.1s ease;
        }
        img:hover {
            animation: glitch 0.5s infinite;
            filter: hue-rotate(90deg) saturate(1.5);
        }
        @keyframes glitch {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-2px, -2px); }
            80% { transform: translate(2px, 2px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>
    <div>
        <h1>Hover-Glitch Effect</h1>
        <p>Hover over the image to see the glitch effect.</p>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b6/Image_created_with_a_mobile_phone.png/1280px-Image_created_with_a_mobile_phone.png" alt="Image">
    </div>
</body>
</html>
