<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eraser Mode</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('https://via.placeholder.com/800x600?text=Background+Image');
            background-size: cover;
            background-position: center;
            height: 100vh;
            position: relative;
        }
        .overlay {
            position: absolute;
            width: 150px;
            height: 150px;
            background-color: rgba(255, 255, 255, 0.8);
            border: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            transition: opacity 0.3s ease;
            cursor: pointer;
        }
        .overlay:hover {
            opacity: 0;
        }
        .overlay:nth-child(1) { left: 100px; top: 100px; }
        .overlay:nth-child(2) { left: 300px; top: 150px; }
        .overlay:nth-child(3) { left: 500px; top: 200px; }
        .overlay:nth-child(4) { left: 200px; top: 300px; }
        .overlay:nth-child(5) { left: 400px; top: 350px; }
    </style>
</head>
<body>
    <div class="overlay">Erase Me 1</div>
    <div class="overlay">Erase Me 2</div>
    <div class="overlay">Erase Me 3</div>
    <div class="overlay">Erase Me 4</div>
    <div class="overlay">Erase Me 5</div>
</body>
</html>
