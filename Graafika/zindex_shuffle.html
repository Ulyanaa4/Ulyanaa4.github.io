<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Index Shuffle</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            height: 100vh;
            position: relative;
        }
        .layer {
            position: absolute;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .layer:hover {
            transform: scale(1.05);
        }
        .layer:nth-child(1) { background-color: #ff0000; left: 100px; top: 100px; z-index: 1; }
        .layer:nth-child(2) { background-color: #00ff00; left: 150px; top: 150px; z-index: 2; }
        .layer:nth-child(3) { background-color: #0000ff; left: 200px; top: 200px; z-index: 3; }
        .layer:nth-child(4) { background-color: #ffff00; left: 250px; top: 250px; z-index: 4; }
        .layer:nth-child(5) { background-color: #ff00ff; left: 300px; top: 300px; z-index: 5; }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Z-Index Shuffle</h1>
    <p style="text-align: center;">Click on any colored square to bring it to the front!</p>
    <div class="layer">1</div>
    <div class="layer">2</div>
    <div class="layer">3</div>
    <div class="layer">4</div>
    <div class="layer">5</div>
    <script>
        const layers = document.querySelectorAll('.layer');
        let maxZ = 10;

        layers.forEach(layer => {
            layer.addEventListener('click', () => {
                layer.style.zIndex = maxZ++;
            });
        });
    </script>
</body>
</html>
